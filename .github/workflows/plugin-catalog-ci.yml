name: Plugin Catalog CI

# Admission gate for plugin-catalog entries. Fires ONLY on PRs touching
# plugin-catalog/** so it can never go red on unrelated PRs.
#
# Two gates:
#   structural            — cheap schema check, no hermes install needed
#   pinned-source-validate — supply-chain gate: the pinned sha MUST be
#                            reachable in the entry's repo, and the plugin
#                            at that exact commit must pass
#                            `hermes plugins validate`.
#
# Trusted base, untrusted data. A PR's catalog files are the only thing either
# job takes from the PR, and only as bytes: each job reads them out of the PR
# merge commit's tree into $RUNNER_TEMP as regular files, deletes the PR
# checkout, and checks out the merge commit's first parent (the base branch tip
# GitHub merged into) in its place. Everything the gate executes after that
# (the structural validator, the setup-pm and retry actions, the PM-built
# hermes, the sandbox wrapper, the payload scanner) is the base's, so a PR can
# neither rewrite the validator that judges its own entries nor run its own
# scanner, action or core outside the sandbox. Limit: this workflow file itself
# runs from the PR (pull_request event), so a PR editing it is stopped only by
# review of the workflow, not by anything here.
#
# Bootstrap: each job's "Confirm the trusted checkout" lists the tools it will
# run and fails if the base lacks one, never falling back to the PR's copy. A
# PR that adds a tool (the sandbox wrapper, say) changes no entry, so neither
# job runs that tool for it; entry PRs need a base that already has it.

on:
  pull_request:
    paths:
      - "plugin-catalog/**"
      # A change to the gate itself runs the gate it changes.
      - ".github/workflows/plugin-catalog-ci.yml"

permissions:
  contents: read

jobs:
  structural:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          # The merge commit and its first parent, the trusted base.
          fetch-depth: 2
          persist-credentials: false # this job is read-only

      - name: Export the PR's catalog data
        id: data
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::error::expected the pull_request merge commit as HEAD"
            exit 1
          fi
          # Every file under plugin-catalog/ in the merged tree, read from the
          # tree (never the worktree) and written as a regular file. A symlink
          # or submodule there would have the validator read something other
          # than the bytes that land, so it fails here instead.
          DATA="${RUNNER_TEMP:?}/catalog-data"
          rm -rf -- "$DATA"
          mkdir -p -- "$DATA/plugin-catalog"
          LIST=$(mktemp)
          git ls-tree -r -z --full-tree \
            --format='%(objectmode) %(objecttype) %(objectname)%x09%(path)' HEAD -- plugin-catalog/ > "$LIST"
          BAD=0
          while IFS= read -r -d '' rec; do
            meta=${rec%%$'\t'*} path=${rec#*$'\t'}
            case "/$path/" in */../*|*/./*|*//*) BAD=1; continue ;; esac
            case "$meta" in
              "100644 blob "*|"100755 blob "*)
                mkdir -p -- "$DATA/$(dirname -- "$path")"
                git cat-file blob "${meta##* }" > "$DATA/$path" ;;
              *) BAD=1 ;;
            esac
          done < "$LIST"
          rm -f -- "$LIST"
          if [ "$BAD" -ne 0 ]; then
            echo "::error::plugin-catalog/ may only hold regular files"
            exit 1
          fi
          {
            echo "base=$(git rev-parse 'HEAD^1')"
            echo "dir=$DATA/plugin-catalog"
          } >> "$GITHUB_OUTPUT"

      - name: Drop the PR checkout
        run: |
          set -euo pipefail
          # Nothing of the PR may stay where the gate executes from; its catalog
          # bytes were exported above.
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

      - name: Check out the trusted base
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          ref: ${{ steps.data.outputs.base }}
          persist-credentials: false

      - name: Confirm the trusted checkout
        env:
          TRUSTED_BASE: ${{ steps.data.outputs.base }}
          # Every workspace file this job executes.
          TRUSTED_TOOLS: scripts/validate_plugin_catalog.py .github/actions/retry/action.yml
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${TRUSTED_BASE:?}" ] \
              || [ -n "$(git status --porcelain --ignored --untracked-files=all)" ]; then
            echo "::error::the workspace is not exactly the trusted base $TRUSTED_BASE"
            exit 1
          fi
          # Bootstrap: a base from before a tool was added cannot run it, and
          # the PR's copy is never a fallback. The PR that adds a tool changes
          # no entry, so it never reaches the step that runs it; an entry PR on
          # an older base fails here and passes once rebased.
          MISSING=""
          for tool in ${TRUSTED_TOOLS:?}; do
            if [ -L "$tool" ] || [ ! -f "$tool" ]; then MISSING="$MISSING $tool"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the trusted base $TRUSTED_BASE predates this gate (missing:$MISSING); rebase the PR onto its base branch"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install ruamel.yaml
        uses: ./.github/actions/retry
        with:
          command: pip install ruamel.yaml==0.18.17

      - name: Validate catalog files (structural)
        env:
          CATALOG_DATA: ${{ steps.data.outputs.dir }}
        run: |
          set -euo pipefail
          # The base's validator over the PR's exported catalog. Validating the
          # whole directory keeps the invariant that EVERYTHING in
          # plugin-catalog/ stays valid.
          python3 -I scripts/validate_plugin_catalog.py "${CATALOG_DATA:?}/"

  pinned-source-validate:
    # [daveey] Plugin code runs only inside bubblewrap (see the validate step).
    # hermes-hub is served only by the tfgar-hub group: one throwaway VM per job
    # from the runner AMI, whose provision.sh (hosts/hermes-ci-runners/packer)
    # installs bubblewrap, persists kernel.apparmor_restrict_unprivileged_userns=0
    # and fails the image build unless the runner user can start bwrap. The
    # sandbox step below proves it on every run and fails closed if not.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # [daveey] An upstream sync re-validates every catalog entry upstream
    # touched (126 in the c314285 sync, ~18 s each): 30 min cancelled it at 88.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          # Full commit graph, blobs on demand: the admission check below needs
          # the merge commit's first parent and its upstream merge-bases.
          fetch-depth: 0
          filter: blob:none
          # `hermes plugins validate` below runs pinned-repo code; keep the
          # job's token out of .git/config where that code could read it.
          persist-credentials: false

      # Fork: keep these inline gates rather than upstream's catalog_*.py
      # entrypoints, which do not enforce trusted-base execution or sandboxing.
      - name: Find changed catalog entries
        id: changed
        env:
          # Public upstream, fetched anonymously for the upstream-sync check.
          UPSTREAM_REPO: https://github.com/NousResearch/hermes-agent.git
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # HEAD is the PR merge commit: diffing it against its first parent is
          # exactly what the PR would land. Refuse anything else rather than
          # silently diffing a single commit.
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::error::expected the pull_request merge commit as HEAD"
            exit 1
          fi
          # Added + modified + typechanged entry files only; deletions and
          # removed.yaml have nothing to clone. A file->symlink change that
          # slipped past this list would skip the supply-chain gate.
          # --no-renames: this checkout is blobless and its token is already
          # removed (persist-credentials: false), so rename detection's
          # similarity check would lazily fetch old blobs from the private fork
          # and die on a credential prompt. Tree entries alone answer
          # --name-only, and a rename lists as delete-old + add-new, so the new
          # path still reaches the gate.
          CHANGED=$(git diff --no-renames --name-only --diff-filter=AMT 'HEAD^1' HEAD \
            -- 'plugin-catalog/*.yaml' 'plugin-catalog/*.yml')
          # The grep can only shrink the list and runs on its own so a git diff
          # failure still fails the step instead of looking like "no changes".
          CHANGED=$(printf '%s' "$CHANGED" | grep -v '/removed\.yaml$' || true)

          if [ -n "$CHANGED" ]; then
            # Entry PRs are data-only: an entry PR that also changes anything
            # outside the data dirs is refused, unless it is an upstream sync.
            # The gate never executes the PR's other files (every tool below
            # runs from the trusted base), so this keeps review of an entry PR
            # to its entries, not the gate's integrity. Contributor email maps
            # are data; README/policy/CI PRs with no entry change skip this.
            # Without renames, both the old and the new path of a moved file
            # count here. Paths are read NUL-delimited: git quotes an unusual
            # name in line output.
            PATHS_Z=$(mktemp)
            git diff -z --no-renames --name-only 'HEAD^1' HEAD > "$PATHS_Z"
            OUTSIDE=$(while IFS= read -r -d '' f; do
                case "$f" in plugin-catalog/*|contributors/emails/*) ;; *) printf '%s\n' "$f" ;; esac
              done < "$PATHS_Z")
            rm -f -- "$PATHS_Z"
            if [ -n "$OUTSIDE" ]; then
              # (fork) An upstream sync lands upstream's catalog entries together
              # with upstream's core in one merge. OLD_UP is the base's (HEAD^1)
              # merge-base with upstream main, NEW_UP the merge commit's, and the
              # PR must advance it. Every changed ENTRY must then be upstream's
              # own OLD_UP..NEW_UP change to an entry the fork had not modified
              # (base == OLD_UP, result == NEW_UP, NEW_UP != OLD_UP), so a sync
              # can neither restore a fork-deleted entry, overwrite or revert a
              # fork-local pin, nor slip in an entry of its own. The rest of the
              # merge (core, actions, scanners, conflict resolutions) is not
              # checked here: none of it is executed by this gate. Trees alone
              # answer (mode + object id), so the blobless checkout needs no
              # credential, and anything unresolvable fails closed. Every
              # admitted entry is still validated below.
              tree_entry() {
                local out
                out=$(git --literal-pathspecs ls-tree -z --format='%(objectmode) %(objectname)' \
                        "$1" -- "$2" | tr -d '\0') || return 1
                printf '%s' "$out"
              }
              upstream_entry() {
                local head new base old
                head=$(tree_entry HEAD "$1") && new=$(tree_entry "$NEW_UP" "$1") \
                  && base=$(tree_entry 'HEAD^1' "$1") && old=$(tree_entry "$OLD_UP" "$1") || return 1
                [ -n "$head" ] && [ "$head" = "$new" ] && [ "$base" = "$old" ] && [ "$new" != "$old" ]
              }
              one_base() {
                local bases
                bases=$(git merge-base --all "$1" refs/catalog-gate/upstream) || return 1
                [ -n "$bases" ] && [ "$(printf '%s\n' "$bases" | wc -l)" -eq 1 ] || return 1
                printf '%s' "$bases"
              }
              ADMIT_REASON="" OLD_UP="" NEW_UP=""
              if ! git fetch --quiet --no-tags --filter=blob:none "$UPSTREAM_REPO" \
                    '+refs/heads/main:refs/catalog-gate/upstream' </dev/null; then
                ADMIT_REASON="could not resolve upstream main"
              elif ! OLD_UP=$(one_base 'HEAD^1') || ! NEW_UP=$(one_base HEAD); then
                ADMIT_REASON="no single merge-base with upstream main"
              elif [ "$OLD_UP" = "$NEW_UP" ] || ! git merge-base --is-ancestor "$OLD_UP" "$NEW_UP"; then
                ADMIT_REASON="the PR does not advance the base's upstream merge-base $OLD_UP"
              fi
              if [ -n "$ADMIT_REASON" ]; then
                echo "::warning::$ADMIT_REASON; not an upstream sync"
                UNTRUSTED="$CHANGED"
              else
                UNTRUSTED=$(printf '%s\n' "$CHANGED" | while IFS= read -r f; do
                    [ -z "$f" ] && continue
                    upstream_entry "$f" || printf '%s\n' "$f"
                  done)
              fi
              if [ -n "$UNTRUSTED" ]; then
                echo "::error::catalog entry PRs may only touch plugin-catalog/** and contributors/emails/**, found:"
                # Filenames are PR-controlled; a newline in one could smuggle a
                # workflow command into the log.
                printf '%s' "$OUTSIDE" | tr '\0\n' ' '
                echo
                echo "Entries that are not upstream's change to a fork-unmodified entry:"
                printf '%s' "$UNTRUSTED" | tr '\0\n' ' '
                echo
                exit 1
              fi
              echo "Upstream sync: every changed entry is upstream $OLD_UP..$NEW_UP verbatim on a fork-unmodified entry."
            fi

            # The candidates, as the only bytes the validation below takes from
            # the PR: each entry's blob from the merge commit's tree, written as
            # a regular file outside the workspace (which is about to become the
            # base). A non-regular entry (symlink, submodule) is not exported and
            # fails validation as "not a regular file".
            # No credential needed: these are HEAD's blobs, which actions/checkout
            # fetched for the worktree while its token was still configured. Any
            # other blob would be a lazy fetch from the private fork without a
            # token, which fails the step (closed), never prompts.
            CAND="${RUNNER_TEMP:?}/catalog-candidates"
            rm -rf -- "$CAND"
            mkdir -p -- "$CAND"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "/$f/" in */../*|*/./*|*//*) continue ;; esac
              rec=$(git --literal-pathspecs ls-tree -z --format='%(objectmode) %(objecttype) %(objectname)' \
                      HEAD -- "$f" | tr -d '\0')
              case "$rec" in
                "100644 blob "*|"100755 blob "*)
                  mkdir -p -- "$CAND/$(dirname -- "$f")"
                  git cat-file blob "${rec##* }" > "$CAND/$f" ;;
              esac
            done <<< "$CHANGED"
            echo "candidates=$CAND" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed catalog entries:"
          echo "${CHANGED:-<none>}"
          {
            echo "base=$(git rev-parse 'HEAD^1')"
            echo 'files<<__EOF__'
            echo "$CHANGED"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Drop the PR checkout
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          # Nothing of the PR may stay where the gate executes from: its
          # candidate entries were exported above, its other files are never run.
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

      - name: Check out the trusted base
        if: steps.changed.outputs.files != ''
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          ref: ${{ steps.changed.outputs.base }}
          # Full commit graph + tags, blobs on demand: Hermes resolves its own
          # version from the release tags merged into HEAD. A shallow checkout
          # reports "unknown", which plugins checking the host version reject (omh).
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Confirm the trusted checkout
        if: steps.changed.outputs.files != ''
        env:
          TRUSTED_BASE: ${{ steps.changed.outputs.base }}
          # Every workspace file this job executes.
          TRUSTED_TOOLS: >-
            scripts/ci/plugin_validation_sandbox.py scripts/scan_plugin_payloads.py
            .github/actions/setup-pm/action.yml
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${TRUSTED_BASE:?}" ] \
              || [ -n "$(git status --porcelain --ignored --untracked-files=all)" ]; then
            echo "::error::the workspace is not exactly the trusted base $TRUSTED_BASE"
            exit 1
          fi
          # Bootstrap, as in the structural job: never the PR's copy of a tool.
          MISSING=""
          for tool in ${TRUSTED_TOOLS:?}; do
            if [ -L "$tool" ] || [ ! -f "$tool" ]; then MISSING="$MISSING $tool"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the trusted base $TRUSTED_BASE predates this gate (missing:$MISSING); rebase the PR onto its base branch"
            exit 1
          fi

      - name: Fetch upstream release identity
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          # The fork carries upstream commits but publishes no release tags.
          # Full history from the fork alone therefore still reports unknown.
          # Import only official release refs, never PR-controlled metadata;
          # version_info selects only tags reachable from the trusted HEAD.
          # Do not force conflicting tags or move the checked-out base.
          git fetch --no-tags --filter=blob:none \
            https://github.com/NousResearch/hermes-agent.git 'refs/tags/v*:refs/tags/v*'

      - name: Prepare Hermes from the trusted base
        if: steps.changed.outputs.files != ''
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'

      - name: Allow bubblewrap user namespaces
        # Blacksmith's Ubuntu 24.04 image restricts unprivileged user namespaces
        # (the old tfgar runner AMI lifted this at bake time). The proof below
        # still fails closed if the host cannot isolate.
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq bubblewrap
          # Blacksmith kernels have no AppArmor userns knob (unrestricted already).
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      - name: Prove the plugin validation sandbox
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          # The previous step installed bubblewrap and allowed unprivileged user
          # namespaces; nothing else is reconfigured here. A
          # runner without them fails this step: the exact wrapper the validate
          # step uses never runs a command it could not isolate (exit 125 setup,
          # 126 self-check, bwrap's own 1), so a broken host fails once, here.
          echo "kernel.apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          python3 -I scripts/ci/plugin_validation_sandbox.py --no-network -- /bin/true
          echo "plugin sandbox ok ($(bwrap --version))"

      - name: Clone each entry at its pinned sha and validate
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          # The PR's entry bytes, exported from its tree before the checkout
          # became the trusted base. The workspace holds no PR file.
          CATALOG_CANDIDATES: ${{ steps.changed.outputs.candidates }}
          # A hostile repo URL must never block the job on a credential prompt.
          GIT_TERMINAL_PROMPT: "0"
          # `gh attestation verify` (README rule 17) reads the attestation from
          # GitHub and needs a token. Read-only default token. Plugin code
          # (`hermes plugins validate --install-deps`) runs only inside
          # scripts/ci/plugin_validation_sandbox.py: a cleared environment and
          # its own user/PID/mount/net namespaces, so neither this shell's
          # environment nor any host process or credential file is visible to
          # it, and nothing it starts outlives it. The token stays out here for
          # the attestation check, which reads the read-only clone afterwards.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED=0
          WORKROOT=$(realpath "$(mktemp -d)")
          CAND_ROOT=$(realpath -e -- "${CATALOG_CANDIDATES:?}")
          # Entries arrive on fd 3, not stdin: `hermes plugins validate` executes
          # plugin-declared install code that could otherwise read stdin and
          # silently drain the remaining entry list.
          while IFS= read -r entry <&3; do
            [ -z "$entry" ] && continue
            echo "::group::validate $entry"

            # A symlinked, missing or out-of-tree entry file is not a catalog
            # entry. The export writes regular files only; this re-checks the
            # bytes the parsers below read.
            ENTRY_FILE="$CAND_ROOT/$entry"
            case "/$entry/" in */../*|*/./*|*//*) ENTRY_FILE="" ;; esac
            if [ -z "$ENTRY_FILE" ] || [ -L "$ENTRY_FILE" ] || [ ! -f "$ENTRY_FILE" ]; then
              echo "::error file=$entry::catalog entry must be a regular file"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # Parse repo / sha / subdir from the entry yaml. These fields are
            # PR-controlled, so the entry is rejected here before anything uses
            # them -- the clone must be remote-only and the subdir a plain
            # relative path, or the pinned sha ends up validating files outside
            # the pinned commit. `python3 -I` keeps the cwd's modules off
            # sys.path so nothing there can shadow the parser's imports;
            # ruamel.yaml comes from installed packages.
            PARSED=$(python3 -I - "$ENTRY_FILE" <<'PYEOF'
          import re
          import shlex
          import sys

          from ruamel.yaml import YAML

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = YAML(typ='safe').load(fh)
          except Exception:
              data = None
          repo = str(data.get('repo', '')) if isinstance(data, dict) else ''
          sha = data.get('sha', '') if isinstance(data, dict) else ''
          subdir_raw = data.get('subdir', '') if isinstance(data, dict) else ''
          if subdir_raw is None:
              subdir_raw = ''  # `subdir:` with no value means the repo root
          subdir = subdir_raw if isinstance(subdir_raw, str) else ''
          bad = ""
          if data is None:
              bad = "entry yaml is empty or unparseable"
          elif not isinstance(data, dict):
              bad = "entry yaml must be a mapping"
          elif not re.fullmatch(r"https://\S+", repo):
              # No whitespace either: the value is echoed into the log, where a
              # newline would smuggle workflow commands like ::error::.
              bad = "repo must be an https:// git URL"
          elif not isinstance(sha, str):
              bad = "sha must be a string"
          elif not re.fullmatch(r"[0-9a-f]{40}", sha):
              # A ref name would validate the branch tip, not the pin; a leading
              # '-' would become a checkout option.
              bad = "sha must be exactly 40 lowercase hex characters"
          elif not isinstance(subdir_raw, str):
              # Never coerce: a falsy non-string (0, false) would silently mean
              # the clone root while the structural gate rejects the entry.
              bad = "subdir must be a string"
          elif subdir and (
              not re.fullmatch(r"[A-Za-z0-9._/-]+", subdir)
              or any(seg in ("", ".", "..") for seg in subdir.split("/"))
          ):
              bad = "subdir must be a relative path without '.' or '..' segments"
          print(f"REPO={shlex.quote(repo)}")
          print(f"SHA={shlex.quote(str(sha))}")
          print(f"SUBDIR={shlex.quote(subdir)}")
          print(f"BAD={shlex.quote(bad)}")
          PYEOF
          ) || PARSED="BAD='catalog entry parser failed'"
            # Reset before eval: a killed or truncated parser must not let this
            # entry inherit a previous entry's repo/sha and pass on its content.
            REPO="" SHA="" SUBDIR="" BAD=""
            eval "$PARSED"
            # Check before echo: a rejected value must never reach the log, where
            # a newline in it would smuggle workflow commands like ::error::.
            if [ -n "$BAD" ]; then
              echo "::error file=$entry::$BAD"
              FAILED=1; echo "::endgroup::"; continue
            fi
            echo "repo=$REPO sha=$SHA subdir=$SUBDIR"

            CLONE_DIR=$(realpath "$(mktemp -d -p "$WORKROOT")")
            # Full clone (no --depth 1): the pinned sha may not be the branch tip.
            # 600s: listed repos reach >1 GB (hermes-jackal-verified 1.43 GB,
            # hindsight 741 MB); 120s would false-fail a re-pin on a slow runner.
            if ! timeout 600 git clone "$REPO" "$CLONE_DIR" </dev/null; then
              echo "::error file=$entry::clone failed for $REPO"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # The pin must name a commit object -- a tag-object sha would peel
            # to a commit the reviewer never declared as the pin.
            if [ "$(git -C "$CLONE_DIR" cat-file -t "$SHA" 2>/dev/null)" != "commit" ]; then
              echo "::error file=$entry::pinned sha $SHA is not a commit object in $REPO"
              FAILED=1; echo "::endgroup::"; continue
            fi
            # SUPPLY-CHAIN GATE: the pinned sha must be reachable in the repo.
            if ! git -C "$CLONE_DIR" checkout --detach "$SHA" </dev/null; then
              echo "::error file=$entry::pinned sha $SHA is not reachable in $REPO"
              FAILED=1; echo "::endgroup::"; continue
            fi

            PLUGIN_DIR="$CLONE_DIR${SUBDIR:+/$SUBDIR}"
            # A symlinked directory inside the clone could still point outside
            # it, so confine the resolved path under the clone, not the lexical one.
            RESOLVED_DIR=$(realpath -m -- "$PLUGIN_DIR")
            if [ "$RESOLVED_DIR" != "$CLONE_DIR" ] && [ "${RESOLVED_DIR#"$CLONE_DIR"/}" = "$RESOLVED_DIR" ]; then
              echo "::error file=$entry::subdir '$SUBDIR' resolves outside the pinned clone"
              FAILED=1; echo "::endgroup::"; continue
            fi
            # Confinement is per-symlink too, across the whole clone: find does
            # not descend into a symlinked directory, so an allowed in-clone
            # link like plugin/ext -> ../lib would otherwise hide lib/evil ->
            # /outside from a PLUGIN_DIR-only scan while reads through it still
            # escape the pin.
            if ! find "$CLONE_DIR" -path "$CLONE_DIR/.git" -prune -o -type l -print0 | while IFS= read -r -d '' link; do
                target=$(realpath -m -- "$link")
                case "$target" in "$CLONE_DIR"|"$CLONE_DIR"/*) ;; *) exit 1 ;; esac
              done; then
              echo "::error file=$entry::a symlink in the repo resolves outside the pinned clone"
              FAILED=1; echo "::endgroup::"; continue
            fi
            # Native plugin.yaml OR portable Agent Plugins v1 plugin.json
            # (#81196; native manifest wins when both exist).
            if [ ! -f "$PLUGIN_DIR/plugin.yaml" ] && [ ! -f "$PLUGIN_DIR/plugin.yml" ] && [ ! -f "$PLUGIN_DIR/plugin.json" ]; then
              echo "::error file=$entry::no plugin.yaml or plugin.json at subdir '$SUBDIR' of $REPO@$SHA"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # Manifest schema + declared-vs-registered capability check. This
            # runs the plugin's own code, so only in the sandbox: the checkout
            # and the clone read-only, the PM home writable but discarded on
            # exit (nothing can poison the hermes later entries use), only the
            # PM variables forwarded, egress only to public HTTPS via the
            # wrapper's proxy. A sandbox that cannot be built fails the entry.
            if ! timeout 600 python3 -I "$GITHUB_WORKSPACE/scripts/ci/plugin_validation_sandbox.py" \
                --ro "$GITHUB_WORKSPACE" --ro "$CLONE_DIR" --overlay "${HERMES_HOME:?setup-pm exports HERMES_HOME}" \
                --env PATH --env HERMES_HOME --env HERMES_RUNTIME_DIR --env HERMES_PYTHON \
                --env VIRTUAL_ENV --env PYTHONPATH --env PYTHONUTF8 \
                --chdir "$GITHUB_WORKSPACE" \
                -- hermes plugins validate --install-deps "$PLUGIN_DIR" </dev/null; then
              echo "::error file=$entry::hermes plugins validate failed"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # SELF-UPDATER GATE (README rule 3): scan before provenance-verified
            # paths are removed. Provenance establishes origin, not behavior.
            # JSON-encoded paths preserve spaces and prevent forged log lines.
            SELF_UPDATE=$(python3 -I - "$PLUGIN_DIR" <<'PYEOF'
          import json, re, sys
          from pathlib import Path
          fetch = re.compile(r'releases/latest|releases/download|raw\.githubusercontent\.com|codeload\.github\.com')
          write = re.compile(r'writeTextFile|renamePath|writeFile\(|writeFileSync|renameSync|copyFileSync|cpSync|createWriteStream')
          # Only an inert ajv schema declaration is exempt, never another URL on the same line.
          ajv_id = 'https://raw.githubusercontent.com/ajv-validator/ajv/master/lib/refs/data.json#'
          declaration = re.compile(r'''["$](?:id|ref)["']?\s*:\s*["']''' + re.escape(ajv_id) + r'''["']''')
          extensions = {'.js', '.mjs', '.cjs', '.ts', '.jsx', '.tsx', '.mts', '.cts'}
          for path in Path(sys.argv[1]).rglob('*'):
              if not path.name.endswith(tuple(extensions)) or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8-sig', errors='replace')
              if write.search(text) and fetch.search(declaration.sub('', text)):
                  print(json.dumps(str(path)))  # no path can forge a workflow log line
          PYEOF
            )
            if [ -n "$SELF_UPDATE" ]; then
              echo "::error file=$entry::self-updating code in catalog build (fetches GitHub AND writes plugin files): $SELF_UPDATE"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # UNSCANNABLE-PAYLOAD GATE (README rule 17). A reviewer and the install
            # scanner must be able to read everything shipped at the pin as source:
            # no compiled binaries (by header), committed bytecode, or archives
            # hiding either. Entries that genuinely need a native component list
            # each one under `attested_binaries:` and the binary must carry a
            # GitHub build-provenance attestation tying it to this repo's own
            # workflow at the pinned source digest; those paths are exempted here
            # and verified below. The heredoc supplies Python source on stdin;
            # the entry list is separately held on fd 3.
            ATTESTED=$(python3 -I - "$ENTRY_FILE" <<'PYEOF'
          import re, shlex, sys
          from ruamel.yaml import YAML
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = YAML(typ="safe").load(fh)
          except Exception:
              data = None
          paths = data.get("attested_binaries") if isinstance(data, dict) else None
          if not isinstance(paths, list):
              paths = []
          ok = []
          for p in paths:
              # Relative path, no '.'/'..' segments, no absolute/newline: it is
              # joined onto the clone and echoed into the log.
              if (isinstance(p, str) and re.fullmatch(r"[A-Za-z0-9._/-]+", p)
                      and not any(seg in ("", ".", "..") for seg in p.split("/"))):
                  ok.append(p)
              else:
                  print("BAD=" + shlex.quote(f"attested_binaries entry {p!r} is not a plain relative path"))
                  sys.exit(0)
          print("PATHS=" + shlex.quote("\n".join(ok)))
          PYEOF
          ) || ATTESTED="BAD='attested_binaries parser failed'"
            ATT_BAD=""; ATT_PATHS=""
            eval "${ATTESTED/PATHS=/ATT_PATHS=}"; eval "${ATTESTED/BAD=/ATT_BAD=}" 2>/dev/null || true
            if [ -n "${ATT_BAD:-}" ]; then
              echo "::error file=$entry::$ATT_BAD"
              FAILED=1; echo "::endgroup::"; continue
            fi
            # Verify each declared binary's provenance against THIS repo at the
            # pinned commit; a verified path is dropped from the clone so the
            # detector that follows ignores it, and any other binary still fails.
            ATT_OK=1
            if [ -n "${ATT_PATHS:-}" ]; then
              OWNER_REPO=$(printf '%s' "$REPO" | sed -E 's#^https://github\.com/##; s#\.git$##; s#/$##')
              while IFS= read -r bpath; do
                [ -z "$bpath" ] && continue
                BFILE="$PLUGIN_DIR/$bpath"
                if [ ! -f "$BFILE" ] || [ -L "$BFILE" ]; then
                  echo "::error file=$entry::attested_binaries path is not a regular file: $bpath"
                  ATT_OK=0; break
                fi
                if ! timeout 120 gh attestation verify "$BFILE" \
                    --repo "$OWNER_REPO" --source-digest "$SHA" \
                    --predicate-type https://slsa.dev/provenance/v1 </dev/null; then
                  echo "::error file=$entry::no build-provenance attestation for $bpath at $OWNER_REPO@$SHA (README rule 17)"
                  ATT_OK=0; break
                fi
                rm -f -- "$BFILE"
              done <<EOF_ATT
          $ATT_PATHS
          EOF_ATT
            fi
            if [ "$ATT_OK" -ne 1 ]; then
              FAILED=1; echo "::endgroup::"; continue
            fi
            if ! PAYLOAD=$(python3 -I "$GITHUB_WORKSPACE/scripts/scan_plugin_payloads.py" "$PLUGIN_DIR" </dev/null); then
              # Filenames are repo-controlled: strip newlines so none can forge a
              # workflow command in the log.
              echo "::error file=$entry::unscannable executable payload (README rule 17): $(printf '%s' "$PAYLOAD" | tr '\n' ';')"
              FAILED=1; echo "::endgroup::"; continue
            fi

            echo "✅ PASS: $entry"
            echo "::endgroup::"
          done 3<<< "$CHANGED_FILES"
          rm -rf "$WORKROOT"

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ FAIL: one or more catalog entries failed pinned-source validation"
            exit 1
          fi
          echo "✅ PASS: all changed catalog entries validated at their pinned shas"

name: CI review comment

# Batched PR review summaries: an hourly sweep, plus one targeted refresh
# whenever CI completes on a ship branch's PR head.
#
# The scheduled run snapshots every open same-repo PR: the newest CI
# ``pull_request`` run on the PR's exact head, one comment per PR. It replaces
# the per-run live poller (one 40-minute per-run poller).
#
# workflow_run (CI completed on a ``wt/**`` head): refresh only the PR at that
# exact head (TARGET_HEAD_SHA). ``hermes-core-wt ship`` lands a PR only once
# this comment says "ran on <its head>", and every ship rebase makes a new
# head; on the hourly sweep alone an approved, CI-green PR waited up to an hour
# (or for a hand dispatch) after each rebase (PR1104, 2026-11-12). CI on PR
# heads finishes after the sibling Docker run (60 of 60 wt/ heads sampled
# 2026-11-12: Docker done 5-36 min earlier), so this one run posts the final
# "ran on" comment. Only ``wt/**`` branches (what ship pushes), and only CI
# runs that ended success/failure: main pushes and other branches start no run
# here, and other PRs' comments are not rewritten.
#
# It runs from the default branch only and never checks out or executes PR
# code, which makes a write token safe here (workflow_run included: only the
# head sha, a 40-hex string the script validates, crosses from the event).
# Fork PRs are skipped.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["wt/**"]

permissions:
  contents: read
  actions: read
  pull-requests: write

# One batch at a time; a running batch is never cancelled. A targeted refresh
# has its own group per head sha: in a shared group GitHub keeps only the newest
# pending run and cancels the others, which would drop another PR's refresh.
concurrency:
  group: ci-review-comment${{ github.event_name == 'workflow_run' && format('-{0}', github.event.workflow_run.head_sha) || '' }}
  cancel-in-progress: false

jobs:
  comment:
    name: CI review comment
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
      )
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Post batched review summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on schedule/dispatch (every open PR); the completed CI run's
          # head on workflow_run (only that PR).
          TARGET_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # Sibling workflows whose jobs join each comment, one name per line.
          WATCH_WORKFLOWS: |
            Docker Build, Test, and Publish
        run: python3 -u scripts/ci/batch_review_comments.py

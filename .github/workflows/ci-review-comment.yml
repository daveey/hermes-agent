name: CI review comment

# Hourly batched PR review summaries.
#
# One scheduled run snapshots every open same-repo PR: the newest CI
# ``pull_request`` run on the PR's exact head, one comment per PR. It replaces
# the per-run live poller (one 40-minute per-run poller).
#
# It runs from the default branch only and never checks out or executes PR
# code, which makes a write token safe here. Fork PRs are skipped.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

# One batch at a time; a running batch is never cancelled.
concurrency:
  group: ci-review-comment
  cancel-in-progress: false

jobs:
  comment:
    name: CI review comment (hourly)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Post batched review summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sibling workflows whose jobs join each comment, one name per line.
          WATCH_WORKFLOWS: |
            Docker Build, Test, and Publish
        run: python3 -u scripts/ci/batch_review_comments.py

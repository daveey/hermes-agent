name: hermes_state (macOS)

# Runs tests/hermes_state/ on a real macOS host. tests-os.yml only runs
# ``-m platforms`` tests there, so unmarked tests never executed on macOS and a
# darwin-only divergence (65 failures, fixed in a408ba1b05) stayed green for
# weeks. This lane closes that gap.
#
# Runner: self-hosted on the Mac mini (labels self-hosted, macOS, hermes-state),
# a dedicated launchd user agent (com.daveey.ci-runner-hermes-state) with its own
# work dir, one job at a time. GitHub-hosted runners are not used (account
# billing refusal), so this lane does not depend on billing.
#
# ci.yaml calls this for selected same-repository PRs and release/dispatch runs.
# Its macOS state required (v1) consumer requires success when selected.
#
# Main pushes do not run this lane: neither a push trigger here nor CI's call
# (detect masks it on a non-release main push). A PR that touches the lane's
# surface already ran it on CI's merge of the PR into main, and the 4-hourly
# schedule tests main HEAD, so a break from two PRs landing close together (or
# from a change outside the surface) surfaces within 4 h. A main-push run held
# the one mini runner ~10 min and put required PR jobs 18-20 min behind it; of
# its 5 failures in the 16 days before it was dropped, none was a confirmed code
# regression (disk, runner loss, host timeouts; t_01a1d37abf5db0ae). ci-probe/**
# branches keep an unfiltered push trigger for probing the runner.
#
# Alerting on a red scheduled run: no workflow_run watcher here on purpose. The
# hub's main-CI watcher (hermes-state hosts/hermes-hub/ci-watch/ci_main_watch.py,
# SCHEDULED) reads this workflow's schedule runs on main and opens one ci-red
# Kanban fix card per red streak, as for a red main push. hermes-state-recovery.yml
# reruns a runner-lost job once; the watcher reads the run's latest conclusion.
# Renaming or moving this file needs that SCHEDULED entry updated too.
#
# HERMES_HOME points at a throwaway temp dir, so the lane writes none of the live
# ~/.hermes's config, state, sessions or environments. The runner is the daveey
# login (HOME=/Users/daveey, same APFS volume as RUNNER_TEMP), so the temp home
# BORROWS that account's content-checked state (pm/AGENTS.md, Homes that borrow
# the account's state): run_tests.sh provisions from its tool store when the
# pins match, pm hard-links its verified tool entries and unchanged snapshot
# files (never written in place), and uv shares its cache. uv locks that cache
# and keys it by content, the same contract the account's own concurrent
# processes rely on; this lane runs no actions/cache and no cache prune on it
# (setup-pm, which does, sets HERMES_PM_ACCOUNT_SEED=0), and the seed marker is
# kept per uv.lock, so a lane on another lock never re-triggers the account's
# payload merge. Set HERMES_PM_ACCOUNT_SEED=0 here to borrow nothing (the run
# then downloads its own ~2 GiB of tools and uv cache).

on:
  push:
    branches: ['ci-probe/**']
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Commit to test. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Collapse queued scheduled main runs (and ci-probe pushes, per branch), but
  # never supersede a required caller.
  group: ${{ github.workflow == 'hermes_state (macOS)' && (github.event_name == 'push' || github.event_name == 'schedule') && format('hermes-state-macos-push-{0}', github.ref) || format('hermes-state-macos-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.commit || github.sha) }}
  cancel-in-progress: false

jobs:
  hermes-state-macos:
    name: tests/hermes_state (macOS, mini)
    # Defense in depth for other callers: fork PR code never reaches the mini.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, hermes-state]
    # Include cold environment provisioning and reduced-priority shared-host work.
    timeout-minutes: 90
    steps:
      # This dedicated runner executes one job at a time. Recreate only at the
      # first step, before checkout registers post actions or starts test workers.
      # Start cleanup also recovers leftovers from cancelled/failed previous jobs.
      - name: Recreate dedicated CI checkout
        working-directory: ${{ runner.temp }}
        shell: /usr/bin/python3 {0}
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess

          ROOT = Path('/Users/daveey/ci-runner-hermes-state')

          def prepare():
              work = ROOT / '_work'
              expected = {
                  'GITHUB_ACTIONS': 'true',
                  'RUNNER_OS': 'macOS',
                  'GITHUB_REPOSITORY': 'softmax-universe/daveey-hermes',
                  'GITHUB_WORKSPACE': str(work / 'daveey-hermes/daveey-hermes'),
                  'RUNNER_TEMP': str(work / '_temp'),
              }
              if any(os.environ.get(key) != value for key, value in expected.items()):
                  raise RuntimeError('Refusing cleanup outside dedicated CI workspace')
              if Path.cwd() != work / '_temp' or not shutil.rmtree.avoids_symlink_attacks:
                  raise RuntimeError('Cleanup needs runner temp cwd and fd-safe rmtree')
              targets = (work / 'daveey-hermes/daveey-hermes', work / 'hermes')
              # Validate ALL targets before removing any. Never follow an aliased
              # ancestor onto a user checkout, another runner or an external disk.
              for target in targets:
                  for path in (target, *target.parents):
                      if path.is_symlink():
                          raise RuntimeError(f'Refusing symlink: {path}')
                  if target.exists() and (not target.is_dir() or
                                          target.stat().st_dev != ROOT.stat().st_dev):
                      raise RuntimeError(f'Refusing non-directory or foreign device: {target}')
                  if target.exists():
                      if target.is_mount():
                          raise RuntimeError(f'Refusing root mount: {target}')
                      for directory, dirs, _ in os.walk(target, followlinks=False):
                          for name in dirs:
                              child = Path(directory) / name
                              if not child.is_symlink() and (child.is_mount() or
                                      child.stat().st_dev != ROOT.stat().st_dev):
                                  raise RuntimeError(f'Refusing nested mount: {child}')
                      # Runner serialization is the boundary; lsof additionally
                      # refuses survivors from a failed/cancelled previous job.
                      probe = subprocess.run(
                          ['/usr/sbin/lsof', '-nP', '+D', str(target)],
                          capture_output=True, text=True, encoding='utf-8', timeout=120,
                          check=False,
                      )
                      if probe.returncode != 1 or probe.stdout or probe.stderr:
                          raise RuntimeError(f'Checkout busy or lsof uncertain: {target}')
              for target in targets:
                  if target.exists():
                      shutil.rmtree(target)
              # Keep the workspace available even if checkout itself fails.
              targets[0].mkdir(parents=True, exist_ok=True)
              print('Fresh CI checkout; obsolete hermes namespace absent')

          prepare()

      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 1

      - name: Run tests/hermes_state
        shell: bash
        run: |
          set -euo pipefail
          HERMES_HOME="$(mktemp -d "${RUNNER_TEMP:-/tmp}/hermes-home.XXXXXX")"
          export HERMES_HOME
          trap 'rm -rf "$HERMES_HOME"' EXIT
          # The mini also runs BabyBear services and Desktop builds/signing: utility QoS lets
          # macOS put those first, and 2 workers instead of 4 halve this lane's CPU.
          taskpolicy -c utility scripts/run_tests.sh tests/hermes_state/ -j 2
        env:
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

      - name: Measure retained checkout (2 GiB ceiling)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          usage_kib=$(du -sk "$GITHUB_WORKSPACE" | cut -f1)
          printf 'Retained checkout: %s KiB; ceiling: 2097152 KiB (2 GiB)\n' "$usage_kib"
          test "$usage_kib" -le 2097152

# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''

jobs:
  check:
    name: JS & TS checks
    # One 32-core job replaces a 14-leg matrix. The matrix spread about 612s
    # of check payload over 4-core runners. It paid about 371s of repeated
    # setup to do it: 14 checkouts, 14 node installs, 14 node_modules
    # restores.
    #
    # One larger runner installs one time. vitest, tsc and eslint each size
    # their own worker pool from the core count.
    runs-on: [self-hosted, hermes-hub]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          ref: ${{ inputs.commit }}
      - name: Set up the locked JS build toolchain
        id: node
        uses: ./.github/actions/setup-pm
        with:
          # Desktop checks also run Python payload and icon build helpers, and
          # the electron contracts drive real hermes_cli/pm code through
          # HERMES_PYTHON, which needs the application dependencies.
          toolchain: all
          extras: '[]'
          test-environment: 'true'

      - name: Install zsh and a virtual display for Electron
        if: runner.os == 'Linux'
        # Refresh the package index first, like every other apt step here: a
        # runner image without a populated list can't resolve zsh/libnotify4.
        run: |
          # tfgar AMIs are baked in us-west-2; cloud-init rewrites apt sources to
          # the regional mirror on boot, so baked lists are stale (#259). Fail on
          # any partial index fetch instead of installing against stale lists.
          sudo apt-get update --error-on=any
          sudo apt-get install -y zsh xvfb \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64

      # setup-pm caches pnpm's store, not the installed workspace tree.
      # The job then links the full workspace node_modules
      # again and runs the native postinstalls again. Electron's binary is
      # prepared explicitly below. This caches the installed tree itself, keyed on the
      # lockfile, and skips ``pnpm install`` on an exact hit. There are no
      # restore-keys: a partial hit leaves a stale tree, so anything other
      # than an exact lockfile match reinstalls from the start.
      #
      # This install runs WITH scripts, so the tree holds native lifecycle
      # artifacts and the explicitly prepared Electron dist, both inside the cached tree.
      #
      # The ~/.cache/electron download cache stays out of the key on purpose.
      # ``pnpm install`` is skipped on a hit, so nothing reads that cache. It only
      # makes the archive larger.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-scripts-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-pnpm${{ steps.node.outputs.pnpm-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      # Vitest records each file's duration and result under
      # node_modules/.vite/vitest and orders the next run from it, longest first.
      # The run that misses the cache writes it before the post step saves the
      # tree, so every hit until the next lockfile change replays that one run's
      # order: the slowest jsdom suites all start cold together and starve the
      # rest past their 15s timeout. Drop it so each run orders from scratch.
      - name: Drop vitest run history from the restored tree
        run: rm -rf node_modules/.vite/vitest apps/*/node_modules/.vite/vitest ui-tui/node_modules/.vite/vitest ui-tui/packages/*/node_modules/.vite/vitest tests-js/node_modules/.vite/vitest web/node_modules/.vite/vitest

      # No --trust-lockfile: this install is the gate that checks every locked
      # version against pnpm-workspace.yaml's release-age policy.
      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: just js-install

      # The cached tree is keyed on the lockfile alone, so an exact hit proves
      # nothing about the manifests. This checks the lockfile still matches
      # every package.json and passes the release-age policy, without
      # touching node_modules.
      - name: Check the lockfile against the manifests and policy
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: pnpm install --frozen-lockfile --lockfile-only

      # tests-js/pnpm-workspace-policy.test.mjs reads pnpm-workspace.yaml after the install above; an
      # install that rewrites it (an exclude prune, say) would hide what was committed, and the
      # clean-checkout step at the end only warns.
      - name: Check the install kept pnpm-workspace.yaml as committed
        run: git diff --exit-code -- pnpm-workspace.yaml

      - name: Prepare locked Electron runtime before parallel checks
        run: just electron-runtime

      # The WhatsApp bridge is a standalone npm package, outside the root
      # workspaces, so run-workspace-checks never sees it. Two of its suites
      # import @whiskeysockets/baileys, so install its own lockfile first;
      # --ignore-scripts because the tests need no native build.
      - name: Install WhatsApp bridge dependencies
        uses: ./.github/actions/retry
        with:
          command: just js-install-whatsapp-bridge
      - name: Run WhatsApp bridge node tests
        run: just test-whatsapp-bridge

      # Every check runs at the same time. The step fails only after all of
      # them finish. There are two reasons this is not ``pnpm -r run check``.
      #
      #   * ``-r`` stops at the first workspace that fails. A
      #     run then reports one failure, where the matrix this replaced
      #     reported every failure together.
      #   * The unit of work is a CHECK, and not a workspace. apps/desktop is
      #     most of the payload, and its own ``check`` is a serial && chain.
      #     A spread across workspaces alone leaves that chain as the long
      #     pole. This expands the ``check:*`` sub-scripts of a package, so
      #     its lint, ui, electron and plugin suites all run together. That
      #     is the same selection rule the old matrix job used.
      #
      # Discovery is ``pnpm ls -r --depth -1 --json``. A new package or a new
      # ``check:*`` script needs no change here. An empty list is an error and
      # not an empty run, because an empty run reports green after it checks
      # nothing.
      - name: Run all workspace checks
        # apps/desktop's typecheck (several tsc passes over the whole renderer) peaks past node's
        # default ~2 GB old-space cap and dies with "heap out of memory". A runner slot is 4 CPUs
        # and 8 GiB with no swap; the script admits units by their package.json checkMemoryMiB so
        # the sum stays inside that cgroup limit.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          # CI overlay /tmp measured 32-35s write+fsync stalls (#335).
          # Disposable fixtures need executable storage, not durable EBS writes.
          # The scheduler reserves this full 1 GiB inside the 8 GiB cgroup.
          # The runner container may lack CAP_SYS_ADMIN (PR 335 run 41100984332: mount denied).
          # Then fall back to an executable /dev/shm of at least 512 MiB, else the default disk.
          mounted=""
          if temp_root="$(mktemp -d /tmp/wc.XXXXXX)" &&
            sudo mount -t tmpfs -o size=1G,mode=1777,exec,nosuid,nodev tmpfs "$temp_root"; then
            mounted="$temp_root"
          else
            rmdir "$temp_root" 2>/dev/null || true
            echo "::warning::tmpfs mount denied; probing /dev/shm"
            grep -E ' /dev/shm ' /proc/mounts || true
            shm_kib="$(df -Pk /dev/shm 2>/dev/null | awk 'NR==2{print $2}')"
            if [ "${shm_kib:-0}" -ge 524288 ] && ! grep -E ' /dev/shm .*[ ,(]noexec[ ,)]' /proc/mounts >/dev/null; then
              temp_root="$(mktemp -d /dev/shm/wc.XXXXXX)"
            else
              echo "::warning::no executable tmpfs available; fixtures stay on the runner disk"
              temp_root="$(mktemp -d /tmp/wc.XXXXXX)"
            fi
          fi
          cleanup() {
            df -h "$temp_root"
            if [ -n "$mounted" ]; then
              # Job-end process cleanup follows this step. Detach even if a test
              # daemon still holds its cwd; don't leak a mount into the next job.
              sudo umount "$temp_root" || sudo umount -l "$temp_root"
            fi
            rm -rf "$temp_root" 2>/dev/null || true
          }
          trap cleanup EXIT
          TMPDIR="$temp_root" just check-js-ci
      - name: Check the checkout is clean
        # Last step of every job (tests/ci/test_clean_worktree_check.py): a test or CI step that
        # leaves an untracked or modified file in the checkout is reported here. Runs only when
        # every earlier step passed: a step that failed midway can leave its own temp files
        # (a half-extracted download, a worktree its later cleanup never removed).
        uses: ./.github/actions/check-clean-worktree

  # The Prebuilt TUI job of termux-verify.yml installs ui-tui + tests-js +
  # apps/desktop and their dependency closure, not the full
  # workspace the job above installs. A tests-js or ui-tui change that assumes
  # another workspace is installed passes `check` above and first fails there,
  # on some unrelated scripts/termux or pm PR: termux-verify's path filter never
  # runs it on the PR that made the break (7a33a706f5, then run 41097455062 on
  # PR #339). This job runs the same install and the same three commands on
  # every PR that runs this workflow (the frontend lane), so the break lands on
  # its own PR. Its steps must stay identical to termux-verify's `tui` job
  # (tests/ci/test_tui_install_shape.py). About 2 minutes. [daveey]
  tui-install-shape:
    name: Prebuilt TUI install-shape checks
    runs-on: [self-hosted, hermes-hub]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          # tests-js generates real icons; the wrapper needs core Pillow/resvg.
          extras: '[]'
          cache-node: false
      - name: Install the locked JS workspace
        run: pnpm install --frozen-lockfile --filter "{./ui-tui}..." --filter "{./tests-js}..." --filter "{./apps/desktop}..."
      - name: Check and bundle the TUI
        run: |
          pnpm --dir tests-js run check
          pnpm --dir ui-tui run check
          pnpm --dir ui-tui run build
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  # The E2E drivers (desktop-bundle-smoke, install-e2e-run/-macos-run/
  # -windows-run) install ONLY the runtime deps of tests-js and run
  # tests/install/e2e-assets drivers. They run on release or dispatch on hosted
  # macOS/Windows runners, so a driver that imports a devDependency (vitest,
  # jsdom, node-pty, ...) first fails at release time. This job installs that
  # exact shape and resolves every import of every driver entry point. Its
  # install command must stay identical to theirs
  # (tests/ci/test_runtime_install_shape.py). [daveey]
  runtime-install-shape:
    name: E2E driver runtime-install checks
    runs-on: [self-hosted, hermes-hub]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          cache-node: false
      - name: Install locked chat driver dependencies
        run: pnpm install --frozen-lockfile --filter "{./tests-js}..." --prod --ignore-scripts
      - name: Resolve every driver import
        run: |
          node .github/scripts/check-runtime-driver-imports.mjs
          node --test tests/install/e2e-assets/windows-bundled-helpers.test.mjs
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

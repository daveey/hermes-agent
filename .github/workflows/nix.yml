name: Nix flake check

# Builds every output of the flake: the package, the devShell, and the 21
# checks under nix/checks.nix — module evaluation, option parity, .env
# assembly, service argv, and the rest.
#
# This workflow owns its triggers and ci.yml does not call it, for the reason
# docker.yml gives: a reusable-workflow call holds the caller run in progress
# for the full build, and GitHub refuses `gh run rerun` on a run that is still
# in progress. One slow advisory job in the CI lane blocks every rerun of the
# fast required jobs beside it. A separate run reruns and cancels on its own.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      release:
        description: 'Stable-release candidate run: force the flake-check lane regardless of the classifier.'
        required: false
        type: boolean
        default: false
      version:
        description: 'Release version stamped into an isolated flake source tree.'
        required: false
        type: string
        default: ''


permissions:
  contents: read

# A workflow_call run (stable release) is never cancelled: its group uses
# github.run_id so a parent rerun cannot kill this child mid-flight, and
# cancel-in-progress is false there — each run saves the store cache that
# later PRs restore from.
# fork (daveey/hermes): main pushes share `nix-main` (in-flight run finishes, only the newest
# pending push waits), as in ci.yaml. [daveey]
concurrency:
  group: nix-${{ inputs.release == true && github.run_id || github.ref == 'refs/heads/main' && 'main' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.release != true && github.event_name == 'pull_request' }}

env:
  # A stable run is on the default branch, so GITHUB_SHA is not the candidate.
  CANDIDATE_COMMIT: ${{ inputs.commit || github.sha }}

jobs:
  # A `paths:` filter cannot gate this workflow: a push to main must run it
  # whatever changed, because the flake packages the product and nine of the
  # checks run the built binary. The `nix` lane is a slow lane
  # (classify_changes.py): on a pull request it runs for the flake files and
  # the dependency manifests, or the run-e2e label. On push the classifier
  # fails open and every lane is true, so a product change that breaks the
  # flake turns main red after the merge.
  detect:
    name: Detect affected areas
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      nix: ${{ steps.classify.outputs.nix }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          # A stable run passes the claim commit. Every other event tests its own head SHA.
          ref: ${{ inputs.commit || github.sha }}

      - name: Detect affected areas
        id: classify
        uses: ./.github/actions/detect-changes
        with:
          github-token: ${{ github.token }}

  pnpm-deps-hash:
    name: pnpm deps hash
    needs: [detect]
    if: needs.detect.outputs.nix == 'true' || inputs.release == true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          ref: ${{ inputs.commit || github.sha }}

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Reuse flake-check's dependency closure, but never save from this job:
      # concurrent writers would race for the same immutable cache key.
      - name: Restore the Nix store for hash validation
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'pyproject.toml', 'uv.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
          purge: false

      # A restored fixed-output path alone cannot validate pnpm-lock.yaml.
      # Materialize then rebuild it; report hash mismatches on either pass.
      # Leave five minutes for setup/restore/cleanup before the job deadline.
      - name: Check nix/pnpm-deps-hash
        run: timeout --kill-after=30s 15m bash scripts/ci/check_pnpm_deps_hash.sh

  flake-check:
    name: nix flake check
    needs: [detect]
    # Release runs force the lane: a stable candidate must build the flake
    # no matter what its diff touches.
    if: needs.detect.outputs.nix == 'true' || inputs.release == true
    # The build compiles the package and its whole dependency closure, so this
    # takes minutes and not seconds when the cache misses. `nix flake check`
    # builds 21 checks, and --max-jobs defaults to the core count. It uses the
    # wider runner with no more configuration.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1 (fork: upstream uses useblacksmith/checkout)
        with:
          # A stable run passes the claim commit. Every other event tests its own head SHA.
          ref: ${{ inputs.commit || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Every derivation builds in Nix's namespace sandbox, and Nix
            # refuses to build at all when the runner cannot provide one.
            # Nix's default fallback builds unsandboxed instead, and then the
            # host /lib64 loader is visible to the builder, so pm-packages-exec
            # (which must prove the binaries run without it) fails or proves
            # nothing. The docker-ci runners provide the namespaces
            # (daveey/hermes@state hosts/hermes-ci-capacity/NIX-SANDBOX.md).
            sandbox = true
            sandbox-fallback = false
            # A store path that does not substitute is a cache miss and not a
            # build failure. Build it here instead.
            fallback = true
            # Each source archive is fetched one time in a run, and not one
            # time for each evaluation.
            tarball-ttl = 3600

      # Restores /nix/store from the GitHub Actions cache. The store holds the
      # whole dependency closure, so a hit turns a build of several minutes
      # into a short evaluation.
      #
      # The Magic Nix Cache is not an option here. Its free tier ended in
      # February 2025 with the GitHub cache API that it was built on. This
      # action uses the current API and needs no account and no secret.
      - name: Restore and save the Nix store
        id: nix-cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # The closure changes when the flake inputs change or when the
          # dependencies of the project change. The key hashes both, so an
          # edit to the source alone keeps the hit.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'pyproject.toml', 'uv.lock') }}
          # On a miss, restore the newest store for this runner. Most of the
          # closure — Python, node, each transitive library — survives a bump
          # of the lockfile, so an old store still removes most of the work.
          restore-prefixes-first-match: nix-${{ runner.os }}-

          # Save from main only. A cache that a PR writes is visible to that
          # PR alone and never to another branch, so a save there spends the
          # 10 GB quota of the repository and helps no later run. A PR still
          # restores: it reads the cache that the merge to main wrote. This is
          # the same rule that docker.yml applies to `cache-to`.
          save: ${{ github.event_name != 'pull_request' }}

          # Collect garbage before the save, so the store stays inside the
          # 10 GB quota of the repository. Without a limit the store grows at
          # each merge until GitHub removes the entry, and the next PR then
          # gets nothing. This number is the size of the store and not the
          # size of the compressed archive.
          gc-max-store-size-linux: 5G

          # v7 purges before saving, and a purge API 403 aborts the upload
          # with only a warning. Keep the token read-only (also for PRs and
          # reusable callers); let GitHub's LRU evict obsolete keys instead.
          purge: false

      - name: Prepare isolated release source
        if: inputs.release == true
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-source"
          git archive "$CANDIDATE_COMMIT" | tar -x -C "$RUNNER_TEMP/release-source"
          python3 scripts/releases/stamping.py --tree "$RUNNER_TEMP/release-source" \
            --version "$RELEASE_VERSION"

      - name: nix flake check
        # --print-build-logs: a check that fails then prints the assertion
        # that failed, and not only the derivation that failed to build.
        # A path: flake has no git metadata, so the release source names its
        # commit with ?rev=: without it self.rev is null, the install stamp
        # carries no commit, and the packaged CLI reports "unknown".
        # Fail before the job deadline: runner deadlines report cancelled,
        # hiding red main from failure watchers. Reserve time for setup and
        # cache post steps; GNU timeout exits 124 (or 137 after forced kill).
        shell: bash
        run: |
          set -o pipefail
          timeout --kill-after=30s 40m nix flake check "${{ inputs.release == true && format('path:{0}/release-source?rev={1}', runner.temp, env.CANDIDATE_COMMIT) || '.' }}" --print-build-logs 2>&1 | tee "$RUNNER_TEMP/nix-flake-check.log"

      - name: Root stable Nix outputs before cache GC
        run: |
          set -o pipefail
          timeout --kill-after=30s 5m bash scripts/ci/root_nix_cache.sh 2>&1 | tee "$RUNNER_TEMP/nix-cache-roots.log"

      - name: Summarize Nix cache effectiveness
        if: always()
        env:
          NIX_CACHE_HIT: ${{ steps.nix-cache.outputs.hit-primary-key }}
        run: python3 scripts/ci/nix_cache_summary.py "$RUNNER_TEMP/nix-flake-check.log" "$RUNNER_TEMP/nix-cache-roots.log"

      - name: Verify release package runtime identity
        if: inputs.release == true
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          source="path:$RUNNER_TEMP/release-source?rev=$CANDIDATE_COMMIT"
          package="$(nix build "$source#default" --no-link --print-out-paths)"
          actual="$("$package/bin/hermes" --version)"
          ACTUAL_VERSION="$actual" python3 - <<'PY'
          import os

          expected = os.environ["RELEASE_VERSION"]
          # Line one is "Hermes Agent v<version> (...)"; later lines (Python, OpenAI SDK) carry other versions.
          first = os.environ["ACTUAL_VERSION"].splitlines()[0].split()
          actual = first[2].removeprefix("v") if first[:2] == ["Hermes", "Agent"] and len(first) > 2 else ""
          if actual != expected:
              raise SystemExit(f"Nix package version mismatch: expected {expected}, got {actual}")
          PY

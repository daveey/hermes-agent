# actionlint knows only GitHub-hosted runner labels. An org admin names the
# larger runners. Each one therefore reads as "unknown runner label" and hides
# the real findings, unless this file declares it.
self-hosted-runner:
  labels:
    - blacksmith-2vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2404
    - blacksmith-8vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2404-arm
    - blacksmith-2vcpu-windows-2025
    - blacksmith-4vcpu-windows-2025
    - blacksmith-6vcpu-macos-latest
    - blacksmith-12vcpu-macos-latest
    - blacksmith-6vcpu-macos-15
    - blacksmith-12vcpu-macos-15
    - blacksmith-32vcpu-ubuntu-2404
    - blacksmith-32vcpu-ubuntu-2404-arm
    - blacksmith-32vcpu-windows-2025
    # GitHub larger runners (still used by the fork's own jobs and by matrices not yet migrated).
    - ubuntu-latest-96-core
    - ubuntu-latest-32-core
    - ubuntu-latest-32-arm-core
    - windows-latest-32-core
    - windows-latest-32-arm-core
    # fork (daveey/hermes): self-hosted runners on hermes-hub
    # (scripts/fork-ci-runner.sh).
    - hermes-hub
    - docker-ci
    - hermes-hub-poll
    - ci-fast
    # bubblewrap-capable hub slots (tests.yml e2e-upgrade).
    - ci-bwrap
    # Autoscaled one-VM-per-job group for the Python test slices (tests.yml test).
    - tfgar-tests
    # Dedicated single-job macOS state-suite runner on the mini.
    - hermes-state
    - tfgar-probe

# fork (daveey/hermes): known findings that are not bugs. The lint runs in
# .github/workflows/actionlint.yml. Keep each pattern narrow.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # `cache-mode` is a real job key (workflow syntax,
      # jobs.<job_id>.cache-mode) that actionlint 1.7.12 does not know yet.
      - 'unexpected key "cache-mode" for "job" section'
      # A bare `if: false` switches off a lane that has no runner here
      # (macOS/Windows) or is deferred upstream; ci.yaml says why it must
      # stay a bare constant.
      - 'constant expression "false" in condition'
  .github/workflows/windows-bundle-sdk.yml:
    ignore:
      # Upstream runs the cold Windows ARM64 SDK leg twice on purpose.
      - 'duplicate value "windows-latest-32-arm-core" is found in matrix "runner"'

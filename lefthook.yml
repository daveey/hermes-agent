pre-commit:
  jobs:
    - name: lint python
      glob: "*.py" # glob filter
      run: just ruff {staged_files}

    - name: lint web
      root: web/
      glob: "web/**/*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint bootstrap installer
      root: apps/bootstrap-installer/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint desktop app
      root: apps/desktop/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    # CI fails when locales/_keys.desktop.json lags the English strings; regenerate on commit.
    - name: desktop i18n keys
      glob: "apps/desktop/src/i18n/en*.ts"
      run: npm --prefix apps/desktop run -s i18n:keys && git add locales/_keys.desktop.json

    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}
